<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spildevandsdata Danmark</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      color-scheme: light;
      --panel-bg: #ffffff;
      --border: #d9dde3;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #app-error {
      color: #b91c1c;
      padding: 0.5rem 1rem;
    }

    #map-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #detail-panel {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 260px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 1000;
    }

    #detail-panel.hidden {
      display: none;
    }

    #detail-panel h3 {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
    }

    .detail-note {
      font-size: 0.8rem;
      color: #4a5568;
      margin: 0 0 0.75rem;
    }

    .weekday-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 100px;
      margin-bottom: 0.75rem;
    }

    .weekday-bar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .weekday-bar-value {
      font-size: 0.65rem;
      margin-bottom: 2px;
    }

    .weekday-bar-fill {
      width: 100%;
      background: #4299e1;
      border-radius: 2px 2px 0 0;
    }

    .weekday-bar-missing {
      background: #cbd5e0;
    }

    .weekday-bar-label {
      font-size: 0.65rem;
      margin-top: 2px;
      color: #4a5568;
    }

    .detail-close-btn {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
    }

    .qualitative-block {
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
    }

    .qualitative-heading {
      font-size: 0.8rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }

    .qualitative-detail {
      font-size: 0.75rem;
      margin: 0 0 0.25rem;
    }

    .qualitative-source {
      font-size: 0.7rem;
      color: #4a5568;
      margin: 0 0 0.5rem;
    }

    #substance-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--panel-bg);
    }

    .substance-btn {
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #f7fafc;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .substance-btn[aria-pressed="true"] {
      background: #2b6cb0;
      color: white;
      border-color: #2b6cb0;
    }
  </style>
</head>
<body>
  <div id="app-error"></div>

  <div id="map-wrapper">
    <div id="map"></div>
    <div id="detail-panel" class="hidden"></div>
  </div>

  <div id="substance-buttons"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
